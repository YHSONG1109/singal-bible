/* ═══════════════ 날짜 ═══════════════ */
const WEEK = ["주일","월","화","수","목","금","토"];
const WEEK_S = ["일","월","화","수","목","금","토"];
const doy = (d) => Math.round((d - new Date(d.getFullYear(),0,1)) / 86400000) + 1;
const dateOfDay = (y, day) => new Date(y, 0, day);
const bookOf = (r) => {
  if (!r) return "";
  const f = String(r).split(",")[0].trim();
  const m = f.match(/^([^\d]+)/);
  return m ? m[1].trim() : f;
};

/* ═══════════════ 성경 순서 (자동 일정 생성) ═══════════════ */
const OT = [["창세기","창",50],["출애굽기","출",40],["레위기","레",27],["민수기","민",36],["신명기","신",34],["여호수아","수",24],["사사기","삿",21],["룻기","룻",4],["사무엘상","삼상",31],["사무엘하","삼하",24],["열왕기상","왕상",22],["열왕기하","왕하",25],["역대상","대상",29],["역대하","대하",36],["에스라","스",10],["느헤미야","느",13],["에스더","에",10],["욥기","욥",42],["잠언","잠",31],["전도서","전",12],["아가","아",8],["이사야","사",66],["예레미야","렘",52],["예레미야애가","애",5],["에스겔","겔",48],["다니엘","단",12],["호세아","호",14],["요엘","욜",3],["아모스","암",9],["오바댜","옵",1],["요나","욘",4],["미가","미",7],["나훔","나",3],["하박국","합",3],["스바냐","습",3],["학개","학",2],["스가랴","슥",14],["말라기","말",4]];
const NT = [["마태복음","마",28],["마가복음","막",16],["누가복음","눅",24],["요한복음","요",21],["사도행전","행",28],["로마서","롬",16],["고린도전서","고전",16],["고린도후서","고후",13],["갈라디아서","갈",6],["에베소서","엡",6],["빌립보서","빌",4],["골로새서","골",4],["데살로니가전서","살전",5],["데살로니가후서","살후",3],["디모데전서","딤전",6],["디모데후서","딤후",4],["디도서","딛",3],["빌레몬서","몬",1],["히브리서","히",13],["야고보서","약",5],["베드로전서","벧전",5],["베드로후서","벧후",3],["요한일서","요일",5],["요한이서","요이",1],["요한삼서","요삼",1],["유다서","유",1],["요한계시록","계",22]];
const findB = (l, n) => l.findIndex((b) => b[0] === n);
function cursor(list, book, start, sizes) {
  let bi = findB(list, book), ch = start, si = 0;
  return (short) => {
    if (bi < 0 || bi >= list.length) { bi = 0; ch = 1; }
    const size = sizes[si++ % sizes.length];
    const [full, ab, tot] = list[bi];
    const f = ch, t = Math.min(f + size - 1, tot);
    const lab = short ? ab : full;
    const txt = f === t ? `${lab} ${f}` : `${lab} ${f}-${t}`;
    ch = t + 1; if (ch > tot) { bi++; ch = 1; }
    return txt;
  };
}
function psalm(start) { let p = start; return (s) => { const t = `${s?"시":"시편"} ${p}`; p = p>=150?1:p+1; return t; }; }
function genPlan(from, days) {
  const tO = cursor(OT,"예레미야",6,[3,2]), tP = psalm(60);
  const mO = cursor(OT,"느헤미야",4,[3,2]), mN = cursor(NT,"베드로후서",3,[1]), mP = psalm(65);
  const out = {};
  for (let i = 0; i < days; i++)
    out[from+i] = { tongdok:`${tO()}, ${tP()}`, tongdok_url:"", min20:`${mO(true)}, ${mN(true)}, ${mP(true)}`, min20_url:"", essence_book:"", essence_url:"", auto:true };
  return out;
}
const SEED_PLAN = genPlan(215, 200);

/* ═══════════════ 공유문 ═══════════════ */
function build(date, plan, essence) {
  const n = doy(date), t = plan[n];
  if (!t || !t.tongdok) return null;
  const book = bookOf(t.tongdok), prev = plan[n-1];
  const newBook = book && book !== (prev ? bookOf(prev.tongdok) : null);
  const mBook = (t.essence_book || "").trim() || book;
  const head = t.essence_url ? { book: mBook, url: t.essence_url }
    : newBook ? { book, url: essence[book] || "" } : null;
  let s = `${date.getMonth()+1}월 ${date.getDate()}일(${WEEK[date.getDay()]}) ${n}일차\n`;
  if (head) s += `\n성경에센스_${head.book}\n${head.url || "(링크 준비 중)"}\n`;
  s += `\n배경설명 후 통독\n(${t.tongdok})\n${t.tongdok_url || "(링크 준비 중)"}\n`;
  s += `\n20분 신구약 함께 읽기\n(${t.min20})\n${t.min20_url || "(링크 준비 중)"}`;
  return { text: s, newBook, book, essenceUrl: head ? head.url : "", day: n, d: t, head };
}
const videoId = (url) => {
  const m = String(url||"").match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
};

/* ═══════════════ 암호 해시 (간단) ═══════════════ */
async function sha(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

/* ═══════════════ 영상 ═══════════════ */
function Player({ url, accent, tint }) {
  const [inline, setInline] = useState(false);
  const [thumb, setThumb] = useState(0);
  const id = videoId(url);
  useEffect(() => { setInline(false); setThumb(0); }, [url]);
  if (!id) return null;
  const thumbs = [`https://i.ytimg.com/vi/${id}/hqdefault.jpg`,`https://img.youtube.com/vi/${id}/hqdefault.jpg`,`https://i.ytimg.com/vi/${id}/mqdefault.jpg`];
  return (
    <div className="mb-4">
      <div className="rounded-xl overflow-hidden relative" style={{ border:`1px solid ${C.line}`, aspectRatio:"16 / 9", background:"#111" }}>
        {inline ? (
          <iframe key={id} src={`https://www.youtube.com/embed/${id}?playsinline=1&rel=0`} title="영상"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
            referrerPolicy="strict-origin-when-cross-origin" allowFullScreen
            style={{ width:"100%", height:"100%", border:0, display:"block" }} />
        ) : (
          <a href={url} target="_blank" rel="noreferrer" className="block w-full h-full relative">
            {thumb < thumbs.length && <img src={thumbs[thumb]} alt="" onError={() => setThumb(t=>t+1)} style={{ width:"100%", height:"100%", objectFit:"cover", display:"block" }} />}
            <span className="absolute inset-0 flex flex-col items-center justify-center" style={{ background:"rgba(0,0,0,0.3)" }}>
              <span className="flex items-center justify-center rounded-full" style={{ width:62, height:62, background:"rgba(255,255,255,0.95)" }}>
                <span style={{ width:0, height:0, marginLeft:4, borderLeft:`18px solid ${C.ribbon}`, borderTop:"11px solid transparent", borderBottom:"11px solid transparent" }} />
              </span>
              <span className="text-[11px] mt-2.5" style={{ color:"#fff", fontWeight:500 }}>유튜브 앱에서 재생</span>
            </span>
          </a>
        )}
      </div>
      {!inline && <button onClick={() => setInline(true)} className="w-full text-center text-[11px] mt-2 py-2.5 rounded-lg" style={{ background:tint, color:accent, fontWeight:600 }}>여기서 바로 재생해보기</button>}
      {inline && <a href={url} target="_blank" rel="noreferrer" className="block text-center text-[11px] mt-2 py-2.5 rounded-lg" style={{ background:tint, color:accent, fontWeight:600 }}>화면이 까맣다면 유튜브 앱에서 열기 ↗</a>}
    </div>
  );
}

function Linkify({ text }) {
  const parts = String(text).split(/(https?:\/\/\S+)/g);
  return <>{parts.map((p,i) => /^https?:\/\//.test(p)
    ? <a key={i} href={p} target="_blank" rel="noreferrer" style={{ color:"#1B5E8C", textDecoration:"underline", wordBreak:"break-all" }}>{p}</a>
    : <span key={i}>{p}</span>)}</>;
}

function Fold({ title, sub, open, onToggle, accent, children }) {
  return (
    <div className="rounded-xl mb-3 overflow-hidden" style={{ background:C.card, border:`1px solid ${C.line}` }}>
      <button onClick={onToggle} className="w-full flex items-center justify-between px-4 py-3.5 text-left">
        <span>
          <span className="text-sm block" style={{ fontWeight:600 }}>{title}</span>
          {sub && <span className="text-xs" style={{ color:C.muted }}>{sub}</span>}
        </span>
        <span className="text-lg leading-none" style={{ color:accent||C.muted, transform:open?"rotate(45deg)":"none", transition:"transform .2s" }}>+</span>
      </button>
      {open && <div className="px-4 pb-4" style={{ borderTop:`1px solid ${C.line}` }}><div className="pt-3">{children}</div></div>}
    </div>
  );
}

/* ═══════════════ 메인 ═══════════════ */
function App() {
  const [tab, setTab] = useState("home");
  const [plan, setPlan] = useState(SEED_PLAN);
  const [essence, setEssence] = useState({});
  const [notes, setNotes] = useState({});          // key `${day}:${track}` -> body
  const [user, setUser] = useState(null);          // {id, name}
  const [sel, setSel] = useState(doy(new Date()));
  const [year] = useState(new Date().getFullYear());
  const [month, setMonth] = useState(new Date().getMonth());
  const [open, setOpen] = useState({});
  const [toast, setToast] = useState("");
  const [ready, setReady] = useState(false);
  const [isAdmin, setIsAdmin] = useState(false);
  const [edit, setEdit] = useState(false);
  const [bulk, setBulk] = useState("");
  const [showLogin, setShowLogin] = useState(false);
  const [showAdmin, setShowAdmin] = useState(false);
  const noteTimer = useRef({});

  const date = dateOfDay(year, sel);
  const view = useMemo(() => build(date, plan, essence), [sel, plan, essence]);
  const todayDoy = doy(new Date());
  const flash = (m) => { setToast(m); setTimeout(() => setToast(""), 2200); };
  const toggle = useCallback((k) => setOpen(o => ({ ...o, [k]: !o[k] })), []);
  const sb = window.SB;

  /* ── 최초 로드 ── */
  useEffect(() => {
    (async () => {
      try {
        const { data } = await sb.from("plan").select("*");
        if (data) {
          const p = { ...SEED_PLAN };
          data.forEach(r => { p[r.day] = { ...r, auto:false }; });
          setPlan(p);
        }
      } catch (e) { console.warn("일정 로드 실패", e); }
      try {
        const { data } = await sb.from("essence").select("*");
        if (data) { const e = {}; data.forEach(r => e[r.book] = r.url); setEssence(e); }
      } catch {}
      // 저장된 로그인 복원
      try {
        const saved = JSON.parse(localStorage.getItem("singal-user") || "null");
        if (saved) { setUser(saved); await loadNotes(saved.id); }
      } catch {}
      setReady(true);
    })();
  }, []);

  const loadNotes = async (uid) => {
    try {
      const { data } = await sb.from("note").select("*").eq("user_id", uid);
      const map = {};
      (data || []).forEach(r => { map[`${r.day}:${r.track}`] = r.body; });
      setNotes(map);
    } catch (e) { console.warn("노트 로드 실패", e); }
  };

  /* ── 로그인 / 가입 ── */
  const doLogin = async (name, pass, mode) => {
    name = name.trim();
    if (!name || !pass) return flash("이름과 암호를 넣어주세요");
    const hash = await sha(pass);
    try {
      if (mode === "signup") {
        const { data: exist } = await sb.from("app_user").select("id").eq("name", name);
        if (exist && exist.length) return flash("이미 있는 이름입니다. 로그인하세요");
        const { data, error } = await sb.from("app_user").insert({ name, pass_hash: hash }).select().single();
        if (error) throw error;
        finishLogin(data);
      } else {
        const { data } = await sb.from("app_user").select("*").eq("name", name);
        if (!data || !data.length) return flash("없는 이름입니다. 가입하세요");
        if (data[0].pass_hash !== hash) return flash("암호가 다릅니다");
        finishLogin(data[0]);
      }
    } catch (e) { flash("문제가 생겼습니다. 잠시 후 다시"); console.warn(e); }
  };
  const finishLogin = async (u) => {
    const info = { id: u.id, name: u.name };
    setUser(info);
    localStorage.setItem("singal-user", JSON.stringify(info));
    setShowLogin(false);
    await loadNotes(u.id);
    flash(`${u.name}님 반갑습니다`);
  };
  const logout = () => {
    setUser(null); setNotes({});
    localStorage.removeItem("singal-user");
    flash("로그아웃했습니다");
  };

  /* ── 관리자 잠금 ── */
  const ADMIN_HASH = window.ADMIN_HASH;   // index.html에서 설정
  const tryAdmin = async (pw) => {
    const h = await sha(pw);
    if (h === ADMIN_HASH) { setIsAdmin(true); setShowAdmin(false); flash("관리자 모드로 전환했습니다"); }
    else flash("관리자 암호가 다릅니다");
  };

  /* ── 일정 저장 (관리자만) ── */
  const saveDay = async (day, patch) => {
    setPlan(p => ({ ...p, [day]: { ...(p[day]||{}), ...patch, auto:false } }));
    try {
      const cur = { ...(plan[day]||{}), ...patch };
      await sb.from("plan").upsert({
        day, tongdok:cur.tongdok||"", tongdok_url:cur.tongdok_url||"",
        min20:cur.min20||"", min20_url:cur.min20_url||"",
        essence_book:cur.essence_book||"", essence_url:cur.essence_url||"",
        updated_at: new Date().toISOString(),
      });
      flash("저장했습니다. 모두에게 반영됩니다");
    } catch (e) { flash("저장 실패 — 잠시 후 다시"); console.warn(e); }
  };
  const saveEssence = async (book, url) => {
    setEssence(e => ({ ...e, [book]: url }));
    try { await sb.from("essence").upsert({ book, url }); } catch (e) { console.warn(e); }

  const importBulk = async () => {
    const rows = bulk.split("\n").map(l=>l.trim()).filter(Boolean);

      const p = line.split("|").map(s=>s.trim());

      await sb.from("plan").upsert(ups);

  const share = async () => {
    if (!view) return;
    if (navigator.share) { try { await navigator.share({ text: view.text }); return; } catch (e) { if (e && e.name === "AbortError") return; } }

  const cells = useMemo(() => {
    const pad = new Date(year, month, 1).getDay();
    const len = new Date(year, month+1, 0).getDate();

    for (let i=1;i<=len;i++) arr.push(i);
    return arr;
  }, [year, month]);

  /* ── 트랙 화면 ── */
  const TrackScreen = ({ which }) => {
    const s = SRC[which];
    const isT = which === "tongdok";
    const range = view ? (isT ? view.d.tongdok : view.d.min20) : "";
    const url = view ? (isT ? view.d.tongdok_url : view.d.min20_url) : "";
    const label = isT ? "배경설명 후 통독" : "20분 신구약 함께 읽기";
    const key = `${sel}:${which}`;
    if (!view) return <div className="px-4 py-16 text-center text-sm" style={{ color:C.muted }}>{sel}일차 일정이 없습니다.</div>;
    return (
      <div className="px-4 pt-4">
        <div className="flex items-center justify-between mb-3">
          <span className="text-[11px] px-2.5 py-1 rounded-full" style={{ background:s.tint, color:s.color, fontWeight:600 }}>{s.name}</span>
          <a href={s.channel} target="_blank" rel="noreferrer" className="text-[11px]" style={{ color:C.muted }}>채널 열기 ↗</a>
        </div>
        <div className="text-xs mb-1" style={{ color:C.muted }}>{sel}일차 · {label}</div>
        <h2 className="text-xl mb-4" style={{ fontFamily:DISPLAY, fontWeight:800 }}>{range}</h2>
        {url ? <Player url={url} accent={s.color} tint={s.tint} />
          : <div className="rounded-xl mb-4 px-4 py-10 text-center text-sm" style={{ background:C.card, border:`1px solid ${C.line}`, color:C.muted, lineHeight:1.8 }}>이 날 영상 링크가 아직 없습니다<br /><a href={s.playlist} target="_blank" rel="noreferrer" style={{ color:s.color, fontWeight:600 }}>{s.playlistName} 열기 ↗</a></div>}
        <Fold title="성경 본문" sub={range} accent={s.color} open={!!open[`b${key}`]} onToggle={() => toggle(`b${key}`)}>
          <div className="space-y-2">
            <a href="https://www.bskorea.or.kr/bible/korbibReadpage.php" target="_blank" rel="noreferrer" className="block text-center py-2.5 rounded-lg text-sm" style={{ background:s.tint, color:s.color, fontWeight:600 }}>대한성서공회 성경에서 열기</a>
            <a href={"https://bible.godpeople.com/?q=" + encodeURIComponent(range)} target="_blank" rel="noreferrer" className="block text-center py-2.5 rounded-lg text-sm" style={{ background:"#F4F6F8", color:C.ink, fontWeight:600 }}>갓피플 성경에서 열기</a>
          </div>
        </Fold>
        <Fold title="묵상노트" sub={!user ? "로그인하면 기록할 수 있어요" : (notes[key] ? "작성함" : "마음에 남은 말씀을 적어보세요")} accent={s.color} open={!!open[`n${key}`]} onToggle={() => toggle(`n${key}`)}>
          {user ? (
            <>
              <textarea value={notes[key] || ""} onChange={(e) => writeNote(sel, which, e.target.value)} rows={7} placeholder="읽으면서 마음에 남은 구절, 떠오른 생각, 기도 제목을 적어보세요."
                className="w-full px-3 py-3 rounded-lg text-sm outline-none" style={{ border:`1px solid ${C.line}`, background:"#FAFBFC", lineHeight:1.8, resize:"vertical" }} />
              <p className="text-[11px] mt-2" style={{ color:C.muted }}>{user.name}님만 볼 수 있습니다. 자동 저장됩니다.</p>
            </>
          ) : (
            <button onClick={() => setShowLogin(true)} className="w-full py-3 rounded-lg text-sm" style={{ background:s.tint, color:s.color, fontWeight:600 }}>로그인하고 기록하기</button>
          )}
        </Fold>
      </div>
    );
  };

  const TABS = [["home","오늘"],["tongdok","성경통독"],["min20","신구약 함께 읽기"]];

  return (
    <div className="min-h-screen w-full pb-24" style={{ background:C.bg, color:C.ink, fontFamily:BODY }}>
      {/* 헤더 */}
      <header className="px-5 pt-6 pb-4" style={{ background:C.card, borderBottom:`1px solid ${C.line}` }}>
        <div className="max-w-lg mx-auto flex items-start justify-between">
          <div>
            <div className="text-[10px] tracking-[0.3em]" style={{ color:SRC.essence.color }}>SINGAL CENTRAL CHURCH</div>
            <h1 className="text-xl mt-1" style={{ fontFamily:DISPLAY, fontWeight:800 }}>신갈중앙교회 성경통독</h1>
          </div>
          <div className="text-right">
            {user
              ? <button onClick={logout} className="text-[11px] px-2.5 py-1.5 rounded-lg" style={{ border:`1px solid ${C.line}`, color:C.muted }}>{user.name} · 로그아웃</button>
              : <button onClick={() => setShowLogin(true)} className="text-[11px] px-2.5 py-1.5 rounded-lg" style={{ background:C.ribbon, color:"#fff", fontWeight:600 }}>로그인</button>}
            <div className="mt-1.5" style={{ fontFamily:DISPLAY, fontSize:20, fontWeight:800, color:C.ribbon, lineHeight:1 }}>{sel}<span className="text-[10px] ml-1" style={{ color:C.muted, fontFamily:BODY }}>일차</span></div>
          </div>
        </div>
      </header>

      {/* 탭 */}
      <nav style={{ background:C.card, borderBottom:`1px solid ${C.line}` }}>
        <div className="max-w-lg mx-auto flex">
          {TABS.map(([k,label]) => (
            <button key={k} onClick={() => setTab(k)} className="flex-1 py-3 text-[13px]"
              style={{ color:tab===k?C.ribbon:C.muted, fontWeight:tab===k?600:400, borderBottom:`2px solid ${tab===k?C.ribbon:"transparent"}` }}>{label}</button>
          ))}
        </div>
      </nav>

      <div className="max-w-lg mx-auto">
        {!ready ? <div className="px-4 py-20 text-center text-sm" style={{ color:C.muted }}>불러오는 중입니다</div>
        : tab === "home" ? (
          <main className="px-4 pt-4">
            <section className="rounded-xl p-4 mb-4" style={{ background:C.card, border:`1px solid ${C.line}` }}>
              <div className="flex items-center justify-between mb-3">
                <button onClick={() => setMonth(m=>Math.max(0,m-1))} className="px-3 py-1 text-lg" style={{ color:C.muted }}>‹</button>
                <span style={{ fontFamily:DISPLAY, fontWeight:700 }}>{year}년 {month+1}월</span>
                <button onClick={() => setMonth(m=>Math.min(11,m+1))} className="px-3 py-1 text-lg" style={{ color:C.muted }}>›</button>
              </div>
              <div className="grid grid-cols-7 gap-1 mb-1">
                {WEEK_S.map((w,i) => <div key={w} className="text-center text-[10px] py-1" style={{ color:i===0?C.ribbon:C.faint }}>{w}</div>)}
              </div>
              <div className="grid grid-cols-7 gap-1">
                {cells.map((day,i) => {
                  if (!day) return <div key={i} />;
                  const dn = doy(new Date(year,month,day));
                  const on = dn === sel, has = !!plan[dn];
                  return <button key={i} onClick={() => setSel(dn)} className="aspect-square rounded-lg flex items-center justify-center"
                    style={{ background:on?C.ribbon:dn===todayDoy?"#F2F4F6":"transparent", color:on?"#fff":has?C.ink:C.faint }}>
                    <span className="text-sm" style={{ fontFamily:DISPLAY, fontWeight:on?700:400 }}>{day}</span>
                  </button>;
                })}
              </div>
            </section>

            {view ? (
              <>
                <div className="flex items-baseline justify-between mb-2 px-1">
                  <span className="text-sm" style={{ color:C.muted }}>{date.getMonth()+1}월 {date.getDate()}일({WEEK[date.getDay()]}) · {sel}일차</span>
                  {view.d.auto && <span className="text-[10px] px-2 py-0.5 rounded-full" style={{ background:"#FBF4E5", color:"#8A6620" }}>자동 생성 · 확인 필요</span>}
                </div>
                <div className="rounded-xl px-4 py-3.5 text-[13px] whitespace-pre-wrap break-all mb-3" style={{ background:C.bubble, lineHeight:1.75, borderTopLeftRadius:4 }}>
                  <Linkify text={view.text} />
                </div>
                <div className="flex gap-2 mb-4">
                  {["tongdok","min20"].map(k => (
                    <a key={k} href={SRC[k].playlist} target="_blank" rel="noreferrer" className="flex-1 text-center py-2.5 rounded-lg text-[11px]" style={{ border:`1px solid ${C.line}`, color:C.muted }}>{SRC[k].name} 재생목록 ↗</a>
                  ))}
                </div>

                {/* 관리자만 편집 */}
                {isAdmin ? (
                  <>
                    <button onClick={() => setEdit(e=>!e)} className="w-full py-2.5 rounded-lg text-xs mb-3" style={{ border:`1px solid ${C.line}`, color:C.muted }}>{edit ? "닫기" : "일정 · 링크 넣기 (관리자)"}</button>
                    {edit && (
                      <>
                        <section className="rounded-xl p-4 mb-3 space-y-3" style={{ background:C.card, border:`1px solid ${C.line}` }}>
                          <div className="text-sm" style={{ fontFamily:DISPLAY, fontWeight:700 }}>{sel}일차</div>
                          {[["통독 범위","tongdok","예레미야 6-7, 시편 60"],["통독 링크 (CGN)","tongdok_url","https://youtu.be/..."],["20분 범위","min20","느 4-6, 벧후 3, 시 65"],["20분 링크 (공동체)","min20_url","https://youtu.be/..."]].map(([label,k,ph]) => (
                            <label key={k} className="block">
                              <span className="block text-xs mb-1" style={{ color:C.muted }}>{label}</span>
                              <input value={plan[sel]?.[k] || ""} onChange={(e) => setPlan(p=>({...p,[sel]:{...(p[sel]||{}),[k]:e.target.value}}))} placeholder={ph}
                                className="w-full px-3 py-2.5 rounded-lg text-sm outline-none" style={{ border:`1px solid ${C.line}`, background:"#FAFBFC" }} />
                            </label>
                          ))}
                          <div className="pt-1" style={{ borderTop:`1px solid ${C.line}` }}>
                            <div className="text-xs pt-3 mb-2" style={{ color:SRC.essence.color, fontWeight:600 }}>개관 영상 (성경에센스)</div>
                            <label className="block mb-3"><span className="block text-xs mb-1" style={{ color:C.muted }}>권 이름</span>
                              <input value={plan[sel]?.essence_book ?? ""} onChange={(e) => setPlan(p=>({...p,[sel]:{...(p[sel]||{}),essence_book:e.target.value}}))} placeholder={view.book||"예레미야"} className="w-full px-3 py-2.5 rounded-lg text-sm outline-none" style={{ border:`1px solid ${C.line}`, background:"#FAFBFC" }} /></label>
                            <label className="block"><span className="block text-xs mb-1" style={{ color:C.muted }}>개관 영상 링크</span>
                              <input value={plan[sel]?.essence_url ?? ""} onChange={(e) => setPlan(p=>({...p,[sel]:{...(p[sel]||{}),essence_url:e.target.value}}))} placeholder="https://youtu.be/..." className="w-full px-3 py-2.5 rounded-lg text-sm outline-none" style={{ border:`1px solid ${C.line}`, background:"#FAFBFC" }} /></label>
                          </div>
                          <button onClick={() => { saveDay(sel, plan[sel]||{}); if((plan[sel]?.essence_book||view.book) && plan[sel]?.essence_url) saveEssence(plan[sel].essence_book||view.book, plan[sel].essence_url); setEdit(false); }} className="w-full py-3 rounded-lg text-sm" style={{ background:C.ribbon, color:"#fff", fontWeight:600 }}>저장</button>
                        </section>
                        <section className="rounded-xl p-4 mb-4" style={{ background:C.card, border:`1px solid ${C.line}` }}>
                          <div className="text-sm mb-1" style={{ fontFamily:DISPLAY, fontWeight:700 }}>여러 날 한번에 넣기</div>
                          <p className="text-xs mb-3" style={{ color:C.muted, lineHeight:1.7 }}>일차 | 통독범위 | 통독링크 | 20분범위 | 20분링크</p>
                          <textarea value={bulk} onChange={(e) => setBulk(e.target.value)} rows={5} placeholder="215 | 예레미야 6-7, 시편 60 | https://youtu.be/xxx | 느 4-6, 벧후 3, 시 65 | https://youtu.be/xxx"
                            className="w-full px-3 py-2 rounded-lg text-xs outline-none mb-3" style={{ border:`1px solid ${C.line}`, background:"#FAFBFC" }} />
                          <button onClick={importBulk} className="w-full py-3 rounded-lg text-sm" style={{ border:`1px solid ${C.line}`, fontWeight:600 }}>등록</button>
                        </section>
                      </>
                    )}
                  </>
                ) : (
                  <button onClick={() => setShowAdmin(true)} className="w-full py-2.5 rounded-lg text-xs mb-3" style={{ border:`1px solid ${C.line}`, color:C.faint }}>관리자 (일정 수정)</button>
                )}
              </>
            ) : <div className="rounded-xl px-5 py-14 text-center text-sm" style={{ background:C.card, border:`1px solid ${C.line}`, color:C.muted }}>{sel}일차 일정이 없습니다</div>}
          </main>
        ) : <TrackScreen which={tab} />}
      </div>

      {tab === "home" && view && (
        <div className="fixed bottom-0 left-0 right-0 px-4 py-4" style={{ background:"rgba(255,255,255,0.94)", borderTop:`1px solid ${C.line}`, backdropFilter:"blur(8px)" }}>
          <div className="max-w-lg mx-auto"><button onClick={share} className="w-full py-4 rounded-xl text-base" style={{ background:C.ribbon, color:"#fff", fontWeight:600 }}>공유</button></div>
        </div>
      )}

      {/* 로그인 모달 */}
      {showLogin && <LoginModal onClose={() => setShowLogin(false)} onSubmit={doLogin} />}
      {/* 관리자 모달 */}
      {showAdmin && <AdminModal onClose={() => setShowAdmin(false)} onSubmit={tryAdmin} />}

      {toast && <div className="fixed bottom-24 left-1/2 -translate-x-1/2 px-5 py-3 rounded-full text-sm shadow-lg z-50" style={{ background:C.ink, color:"#fff" }}>{toast}</div>}
    </div>
  );
}

/* ═══════════════ 모달 ═══════════════ */
function LoginModal({ onClose, onSubmit }) {
  const [mode, setMode] = useState("login");
  const [name, setName] = useState("");
  const [pass, setPass] = useState("");
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center" style={{ background:"rgba(0,0,0,0.4)" }} onClick={onClose}>
      <div className="w-full max-w-sm rounded-t-2xl sm:rounded-2xl p-5" style={{ background:C.card }} onClick={e=>e.stopPropagation()}>
        <div className="flex gap-2 mb-4">
          {[["login","로그인"],["signup","처음이에요"]].map(([k,l]) => (
            <button key={k} onClick={() => setMode(k)} className="flex-1 py-2 rounded-lg text-sm" style={{ background:mode===k?C.ribbon:"#F4F6F8", color:mode===k?"#fff":C.muted, fontWeight:600 }}>{l}</button>
          ))}
        </div>
        <label className="block mb-3"><span className="block text-xs mb-1" style={{ color:C.muted }}>이름</span>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="홍길동" className="w-full px-3 py-2.5 rounded-lg text-sm outline-none" style={{ border:`1px solid ${C.line}`, background:"#FAFBFC" }} /></label>
        <label className="block mb-4"><span className="block text-xs mb-1" style={{ color:C.muted }}>암호</span>
          <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="개인 암호" className="w-full px-3 py-2.5 rounded-lg text-sm outline-none" style={{ border:`1px solid ${C.line}`, background:"#FAFBFC" }} /></label>
        <button onClick={() => onSubmit(name, pass, mode)} className="w-full py-3 rounded-lg text-sm" style={{ background:C.ribbon, color:"#fff", fontWeight:600 }}>{mode==="signup"?"가입하고 시작":"로그인"}</button>
        <p className="text-[11px] mt-3" style={{ color:C.muted, lineHeight:1.7 }}>묵상노트는 로그인한 본인만 볼 수 있습니다. 암호는 잊지 않게 적어두세요.</p>
      </div>
    </div>
  );
}
function AdminModal({ onClose, onSubmit }) {
  const [pw, setPw] = useState("");
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center" style={{ background:"rgba(0,0,0,0.4)" }} onClick={onClose}>
      <div className="w-full max-w-sm rounded-t-2xl sm:rounded-2xl p-5" style={{ background:C.card }} onClick={e=>e.stopPropagation()}>
        <div className="text-sm mb-3" style={{ fontFamily:DISPLAY, fontWeight:700 }}>관리자 확인</div>
        <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="관리자 암호" className="w-full px-3 py-2.5 rounded-lg text-sm outline-none mb-4" style={{ border:`1px solid ${C.line}`, background:"#FAFBFC" }} />
        <button onClick={() => onSubmit(pw)} className="w-full py-3 rounded-lg text-sm" style={{ background:C.ribbon, color:"#fff", fontWeight:600 }}>확인</button>
        <p className="text-[11px] mt-3" style={{ color:C.muted }}>일정과 영상 링크를 넣는 사람만 사용합니다.</p>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
